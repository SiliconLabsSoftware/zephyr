compatible: "silabs,efr32-cmu-clkout"

description: |
  Silicon Labs EFR32 Series 2 CMU Clock Output (MCO).

  Routes an internal clock source to a GPIO pin via the CMU EXPORTCLKCTRL
  block.  Select a source, optionally divide by a prescaler, and 
  the clock will appear on the pin.

  Example — MCLK = SYSCLK / 4 from HFRCODPLL 76.8 MHz (= 19.2 MHz):

      silabs_cmu_clkout {
          compatible = "silabs,efr32-cmu-clkout";
          status = "okay";
          silabs,clkout-source = "expclk";
          silabs,clkout-prescaler = <4>;
          silabs,clkout-gpio-port = <3>;
          silabs,clkout-gpio-pin = <3>;
      };

include: [base.yaml]

properties:
  silabs,clkout-source:
    type: string
    required: true
    enum:
      - "disabled"
      - "hfrcodpll"
      - "hfxo"
      - "expclk"
      - "fsrco"
      - "lfrco"
      - "lfxo"
      - "ulfrco"
      - "hclk"
    description: |
      Internal clock source muxed to the CLKOUT pin.  Use "expclk" to
      route HFRCODPLL through the EXPORTCLKCTRL prescaler.

  silabs,clkout-prescaler:
    type: int
    default: 1
    description: |
      EXPORTCLKCTRL prescaler (1..32).  Output frequency = source / prescaler.

  silabs,clkout-gpio-port:
    type: int
    required: true
    description: |
      GPIO port index (0 = PA, 1 = PB, 2 = PC, 3 = PD) for the CLKOUT pin.

  silabs,clkout-gpio-pin:
    type: int
    required: true
    description: |
      Pin number (0..15) within the GPIO port.
