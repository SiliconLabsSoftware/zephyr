# Optional overlay for local bring-up: one log line per Unity test (-v)
# and loopback data-integrity groups (requires TX->RX jumper on the board).
#
# From projects/zephyr-4.4.0 (Zephyr tree root):
#
#   west build -b xg27_rb4194a -d build_vlb \
#     tests/drivers/i2s/i2s_silabs_efr32_usart -- \
#     "-DEXTRA_CONF_FILE=prj_verbose_loopback.conf"
#
# PowerShell: quote the -D value so `.conf` is not split into a separate token.
# Bash/zsh:  -DEXTRA_CONF_FILE=prj_verbose_loopback.conf  is fine.
#
# Wiring: DK2602A PC0<->PC1; RB4194A PA8<->PA7.

CONFIG_I2S_EFR32_TEST_VERBOSE=y
CONFIG_I2S_EFR32_TEST_LOOPBACK=y
