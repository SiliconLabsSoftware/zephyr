# printk only for test output; driver LOG_* would flood UART and cause drops.
CONFIG_LOG=n
CONFIG_DMA=y
CONFIG_I2S=y
CONFIG_I2S_SILABS_EFR32_USART=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_PRINTK=y

# Clock-measurement tests use GPIO + k_cycle_get_32() only (em_cmu/em_gpio).
# The I2S driver does not need em_timer / em_prs (see Kconfig.efr32_usart).

# PRS and TIMER1 are used for clock measurement.
CONFIG_SILABS_SISDK_PRS=y
CONFIG_SILABS_SISDK_TIMER=y